version: '3.3'
services:
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: 'db-arms'
      MYSQL_USER: 'dev'
      MYSQL_PASSWORD: 'dev'
      MYSQL_ROOT_PASSWORD: 'dev'
    ports:
      - '2205:3306'
    # Removed 'expose' here because 'ports' already exposes it to the network,
    # and other containers can inherently talk to 3306 using Docker's internal network.
    volumes:
      - arms:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: arms-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  arms:
    driver: local
  redis_data:
    driver: local
